<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="kaltstellen: Drehschalter mit drei Profilen, eines aktiv">
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <!-- aktives Profil -->
    <path d="M8 7.1A12 12 0 0 1 24 7.1" stroke="#C8730A"/>
    <!-- kaltgestellte Profile -->
    <path d="M27.7 13.5A12 12 0 0 1 19.7 27.4M12.3 27.4A12 12 0 0 1 4.3 13.5" stroke="#2A8FD6"/>
  </g>
  <!-- Drehknopf, Zeiger auf dem aktiven Profil -->
  <circle cx="16" cy="17.5" r="3.5" fill="#2A8FD6"/>
  <path d="M16 17.5v-6.5" stroke="#2A8FD6" stroke-width="3" stroke-linecap="round"/>
</svg>
