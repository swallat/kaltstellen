<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="kaltstellen: Schalter mit schmaler Bahn, K und großem warmem Knopf">
  <!-- schmale Schalterbahn -->
  <rect x="1.5" y="10" width="28" height="12" rx="6" fill="#2A8FD6"/>
  <!-- K auf der Bahn -->
  <path d="M7 12.8v6.4M7 16.2 11 12.8M7 15.8 11 19.2" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <!-- großer warmer Knopf, steht über die Bahn hinaus -->
  <circle cx="22.5" cy="16" r="8" fill="#D6770B"/>
  <circle cx="22.5" cy="16" r="3" fill="#fff" opacity=".9"/>
</svg>
