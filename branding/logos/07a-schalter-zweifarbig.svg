<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="kaltstellen: Kippschalter mit K, kalte und warme Bahnhälfte">
  <!-- kalte Bahnhälfte -->
  <rect x="1.5" y="7" width="29" height="18" rx="9" fill="#2A8FD6"/>
  <!-- warme Bahnhälfte -->
  <path d="M14.5 7h7a9 9 0 0 1 0 18h-7z" fill="#D6770B"/>
  <!-- K auf der kalten Seite -->
  <path d="M6.5 11.5v9M6.5 16.3 11.5 11.5M6.5 15.7 11.5 20.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <!-- weißer Schaltknopf auf der warmen Seite -->
  <circle cx="21.5" cy="16" r="6.5" fill="#fff"/>
</svg>
