[package]
name = "kaltstellen"
version = "0.1.0"
edition = "2024"
description = "Switch between app profiles on Windows by suspending, stopping and starting processes"
license = "MIT OR Apache-2.0"
keywords = ["windows", "process", "suspend", "profiles", "tray"]
categories = ["command-line-utilities", "os::windows-apis"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
tempfile = "3.27.0"

[workspace]
members = [".", "tests/fixtures"]
default-members = ["."]
