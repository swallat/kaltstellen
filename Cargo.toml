[package]
name = "kaltstellen"
version = "0.1.0"
edition = "2024"
description = "Switch between app profiles on Windows by suspending, stopping and starting processes"
license = "MIT OR Apache-2.0"
keywords = ["windows", "process", "suspend", "profiles", "tray"]
categories = ["command-line-utilities", "os::windows-apis"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
log = "0.4"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus"] }

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
tempfile = "3"
